# VIGIA Mosquitto ACL — per-device topic isolation
#
# Devices authenticate via mTLS; their CN field becomes the MQTT username.
# Each device may only publish to its own device_id subtopic.
# The ingest server subscribes on the plaintext 1883 listener (no ACL).

# Pattern rules: %u = MQTT username (= device CN from certificate)
pattern write vigia/attest/%u/hazard
pattern write vigia/status/%u/health
pattern read  vigia/config/%u/#
