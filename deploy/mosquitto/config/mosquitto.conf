# VIGIA Mosquitto Broker — mTLS configuration
#
# Devices authenticate with per-device certificates signed by the VIGIA root CA.
# In demo/dev mode: certs generated by tools/vigia-gen-ca.sh + tools/vigia-sign-device.sh
# In production: certs from Microchip Trust Platform (ATECC608A provisioning)
#
# Deploy: docker compose -f deploy/docker-compose.yml up -d
# Test:   mosquitto_sub -h <host> -p 8883 --cafile ca.crt --cert device.crt --key device.key
#          -t "vigia/attest/#" --insecure  # use --insecure only in dev with self-signed CA

# ── Listener (mTLS on 8883) ────────────────────────────────────────────────
listener 8883
protocol mqtt

# Server certificate (signed by VIGIA root CA)
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key

# Require client certificates — mTLS enforcement
require_certificate true
use_identity_as_username true   # device_id in CN field becomes the MQTT username

# TLS version floor
tls_version tlsv1.2

# ── Plaintext listener (localhost only — ingest server internal, no TLS) ──
listener 1883 127.0.0.1
protocol mqtt
allow_anonymous true            # only reachable from localhost; no internet exposure

# ── Persistence ───────────────────────────────────────────────────────────
persistence true
persistence_location /mosquitto/data/

# ── Logging ───────────────────────────────────────────────────────────────
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true

# ── Topic ACL ─────────────────────────────────────────────────────────────
# Devices may only publish to their own device_id subtopic.
# Server (internal 1883) has unrestricted subscribe.
acl_file /mosquitto/config/acl.conf

# ── Resource limits ───────────────────────────────────────────────────────
max_connections 500
max_packet_size 2097152         # 2 MB — covers max 440 KB msgpack payload with headroom
message_size_limit 2097152
