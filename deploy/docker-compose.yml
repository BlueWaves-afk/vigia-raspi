services:

  # ── PostgreSQL + PostGIS ─────────────────────────────────────────────────
  db:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: vigia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: vigia
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigia -d vigia"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Mosquitto mTLS broker ────────────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2.0
    ports:
      - "8883:8883"       # mTLS — devices
      # 1883 intentionally not exposed; ingest accesses via internal network
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/config/acl.conf:/mosquitto/config/acl.conf:ro
      - ./mosquitto/certs:/mosquitto/certs:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -p 1883 -t healthcheck -m ping -q 0 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── FastAPI ingest server ────────────────────────────────────────────────
  ingest:
    build:
      context: ../server
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql://vigia:${POSTGRES_PASSWORD}@db:5432/vigia"
      # Internal plaintext listener — no mTLS needed server→broker
      MQTT_BROKER_HOST: mosquitto
      MQTT_BROKER_PORT: 1883
      HAZARD_MERGE_RADIUS_M: "5"
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  mosquitto_data:
  mosquitto_log:
